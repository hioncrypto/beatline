<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2324352c'/%3E%3Crect x='8' y='6' width='16' height='20' fill='none' stroke='%23f3ecdf' stroke-width='1.6'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h6' stroke='%23e0b089' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
:root {
  --ink: #1c1915;
  --muted: #6f675c;
  --line: #d9d1c4;
  --paper: #f7f3ec;
  --page: #e9e2d6;
  --pine: #24352c;
  --pine-2: #315043;
  --chip: #efe6d8;
  --terracotta: #b5522a;
  --good-bg: #e3f0e6;
  --good: #1c5a34;
  --bad-bg: #f6e4dc;
  --bad: #8a3418;
  color: var(--ink);
  background: var(--page);
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.4;
}

* { box-sizing: border-box; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }
a { color: #8a3d22; }

.shell {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 16px;
  background: var(--pine);
  color: #e7efe9;
}
.brand {
  margin: 0;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -0.03em;
  color: #f6f1e8;
}
.brand small {
  display: block;
  margin-top: 2px;
  font-family: "Source Sans 3", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #c9d5cc;
}
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  text-align: left;
}
.sidebar nav button[aria-current="page"] { background: var(--pine-2); }
.nav-count { color: #c9d5cc; font-variant-numeric: tabular-nums; font-size: 13px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.side-foot label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #c9d5cc; }
.sidebar select,
.side-foot select {
  width: 100%;
  height: 34px;
  padding: 0 8px;
  border: 1px solid #3e5648;
  border-radius: 6px;
  background: #1a2821;
  color: #f3ecdf;
}
.storage { margin: 0; font-size: 12px; color: #c9d5cc; }
.side-foot button {
  padding: 0;
  border: 0;
  background: transparent;
  color: #e7d3c3;
  text-align: left;
  font-size: 13px;
}

main { padding: 28px 28px 72px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
h1 {
  margin: 0;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 32px;
  font-weight: 520;
  letter-spacing: -0.03em;
}
h1 .count {
  margin-left: 8px;
  font-family: "Source Sans 3", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}
.lede { margin: 4px 0 0; color: var(--muted); }
h2, h3 {
  margin: 0 0 8px;
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 560;
}
h2 { font-size: 22px; }
h3 { margin-top: 20px; font-size: 18px; }
.kicker {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.btn {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
}
.btn.primary { background: var(--terracotta); border-color: #9a4522; color: #fff8f4; }
.btn.danger { color: var(--bad); }
.btn.small { height: 30px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
.toolbar input, .toolbar select, .fields input, .fields select, .modal input, .modal select, .modal textarea, .drawer input, .drawer select, .drawer textarea {
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}
.toolbar .search { flex: 1 1 180px; min-width: 160px; }
.menu-wrap { position: relative; }
.popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 190px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
}
.popover label { display: flex; gap: 8px; align-items: center; font-size: 13px; }

.segmented { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; }
.segmented button { height: 34px; padding: 0 12px; border: 0; background: var(--paper); }
.segmented button[aria-pressed="true"] { background: var(--pine); color: #f6f1e8; }

.bulkbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--pine);
  color: #f3ecdf;
}
.bulkbar select { height: 30px; border: 0; border-radius: 6px; background: #f3ecdf; color: var(--ink); }
.bulkbar .btn { background: #f3ecdf; color: var(--ink); }

.table-wrap { overflow: auto; border: 1px solid var(--line); background: var(--paper); }
table { width: 100%; min-width: 760px; border-collapse: collapse; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: #efeae2; }
th button { padding: 0; border: 0; background: none; color: var(--muted); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num button { width: 100%; text-align: right; }
th.check, td.check { width: 36px; }
tr:hover td { background: #f7f1e8; }
tr.is-selected td { background: #f3e6dc; }
tr.is-done td { color: var(--muted); }
tr.is-overdue .due-cell, .overdue { color: var(--bad); font-weight: 700; }
.empty { padding: 28px 12px; color: var(--muted); text-align: left; }

.who { display: inline-flex; gap: 8px; align-items: center; font-weight: 650; }
.avatar {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--pine);
  color: #f3ecdf;
  font-size: 10px;
  letter-spacing: 0.04em;
}
button.linkish { padding: 0; border: 0; background: none; color: #8a3d22; text-align: left; }
button.linkish:hover { text-decoration: underline; }
.pill {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--chip);
  font-size: 12px;
  font-weight: 650;
}
.pill-customer, .pill-won { background: var(--good-bg); color: var(--good); }
.pill-churned, .pill-lost { background: var(--bad-bg); color: var(--bad); }
.pill-qualified, .pill-proposal, .pill-negotiation, .pill-new { background: #e7eee9; color: var(--pine); }
.tag {
  display: inline-flex;
  margin: 0 4px 2px 0;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--chip);
  font-size: 12px;
}

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.stats article, .panel { border: 1px solid var(--line); background: var(--paper); padding: 14px 16px; }
.stat {
  margin: 4px 0;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 28px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr); gap: 16px; margin-top: 16px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 76px; gap: 8px; align-items: center; font-size: 13px; }
.bar-row button { padding: 0; border: 0; background: none; text-align: left; }
.track { height: 8px; background: #e4dcd0; }
.track span { display: block; height: 100%; background: var(--pine); }
.track.won span { background: var(--good); }
.task-line, .feed-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.task-line button.subject, .feed-item button { padding: 0; border: 0; background: none; text-align: left; }
.feed { margin-top: 16px; }

.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.column { width: 230px; flex: none; padding: 8px; border-radius: 8px; background: #e4dcd0; }
.column.drop-target { outline: 2px solid var(--terracotta); }
.column header { display: flex; justify-content: space-between; gap: 8px; padding: 4px 4px 8px; font-size: 13px; }
.deal-card { margin-bottom: 8px; padding: 10px; border: 1px solid var(--line); background: var(--paper); cursor: grab; }
.deal-card strong, .deal-card span { display: block; }
.deal-card .money { margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 700; }
.deal-card .meta, .meta { color: var(--muted); font-size: 12px; }

.scrim { position: fixed; inset: 0; z-index: 20; border: 0; background: rgba(28, 25, 21, 0.32); }
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 21;
  width: min(440px, 100%);
  overflow: auto;
  padding: 20px 20px 40px;
  border-left: 1px solid var(--line);
  background: var(--paper);
}
.drawer-top, .modal-actions, .activity-row { display: flex; gap: 8px; align-items: center; }
.drawer-top { justify-content: space-between; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.fields label, .activity-row label, .stack-label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.span-2 { grid-column: span 2; }
label.checkline { flex-direction: row; align-items: center; color: var(--ink); font-size: 14px; }
.drawer textarea, .modal textarea { height: auto; min-height: 72px; padding: 8px; }
.tagset { display: flex; flex-wrap: wrap; gap: 6px; }
.tagset button { padding: 3px 8px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12px; }
.tagset button[aria-pressed="true"] { border-color: var(--pine); background: var(--pine); color: #f6f1e8; }
.lbl { color: var(--muted); font-size: 12px; }
.note { padding: 8px 0; border-top: 1px solid var(--line); }
.note p { margin: 0; white-space: pre-wrap; }
.form-error { margin: 0 0 8px; color: var(--bad); font-size: 13px; }
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 31;
  width: min(560px, calc(100% - 32px));
  max-height: calc(100vh - 48px);
  overflow: auto;
  padding: 20px;
  border: 1px solid var(--line);
  background: var(--paper);
  transform: translate(-50%, -50%);
}
.modal .scrim, .modal-scrim { z-index: 30; }
.modal-actions { margin-top: 14px; }
.activity-row { flex-wrap: wrap; margin: 8px 0; }
.activity-row input { flex: 1; min-width: 140px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: sticky; top: 0; z-index: 5; height: auto; }
  .sidebar nav { flex-direction: row; overflow-x: auto; }
  .sidebar nav button { width: auto; white-space: nowrap; }
  .side-foot { flex-direction: row; flex-wrap: wrap; align-items: end; margin-top: 8px; }
  .side-foot label { flex: 1 1 140px; }
  .storage { display: none; }
  .stats, .split, .fields { grid-template-columns: 1fr 1fr; }
  .span-2 { grid-column: auto; }
  main { padding: 18px 14px 48px; }
  h1 { font-size: 28px; }
}
@media (max-width: 640px) {
  .stats, .fields, .split { grid-template-columns: 1fr; }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
/* Fieldbook — a local CRM list. Open index.html, or run open-fieldbook. */
const STORAGE_KEY = "fieldbook.v1";
const OWNERS = ["Avery Chen", "Jordan Hale", "Sam Okonkwo"];
const CONTACT_STAGES = ["Lead", "Qualified", "Customer", "Churned"];
const SOURCES = ["Inbound", "Outbound", "Referral", "Event", "Partner"];
const TAGS = ["Priority", "Champion", "Renewal", "Partner", "Newsletter"];
const SIZES = ["1–10", "11–50", "51–200", "201–1,000"];
const INDUSTRIES = ["Manufacturing", "Architecture", "Food", "Logistics", "Publishing", "Healthcare", "Retail", "Legal", "Software", "Transportation"];
const TASK_TYPES = ["Call", "Email", "Meeting", "Task"];
const DEAL_STAGES = [
  { id: "new", label: "New", probability: 10 },
  { id: "qualified", label: "Qualified", probability: 25 },
  { id: "proposal", label: "Proposal", probability: 50 },
  { id: "negotiation", label: "Negotiation", probability: 75 },
  { id: "won", label: "Won", probability: 100 },
  { id: "lost", label: "Lost", probability: 0 },
];
const DEFAULT_COLUMNS = {
  people: ["name", "title", "company", "email", "owner", "stage", "source", "tags", "last"],
  companies: ["name", "domain", "industry", "size", "city", "owner", "people", "pipeline"],
  deals: ["name", "company", "amount", "stage", "probability", "close", "owner"],
  tasks: ["due", "type", "subject", "related", "owner", "status"],
};
const BUILTINS = {
  people: [
    { id: "all", name: "All people" },
    { id: "mine", name: "My book", filters: { owner: "__me__" } },
    { id: "customers", name: "Customers", filters: { stage: "Customer" } },
    { id: "leads", name: "Open leads", filters: { stage: "Lead" } },
  ],
  companies: [
    { id: "all", name: "All companies" },
    { id: "mine", name: "My companies", filters: { owner: "__me__" } },
  ],
  deals: [
    { id: "open", name: "Open pipeline", filters: { status: "open" } },
    { id: "mine", name: "My open deals", filters: { owner: "__me__", status: "open" } },
    { id: "won", name: "Won", filters: { status: "won" } },
    { id: "all", name: "All deals", filters: { status: "all" } },
  ],
  tasks: [
    { id: "open", name: "Open tasks", filters: { status: "open" } },
    { id: "mine", name: "My tasks", filters: { owner: "__me__", status: "open" } },
    { id: "overdue", name: "Overdue", filters: { status: "overdue" } },
    { id: "all", name: "All tasks", filters: { status: "all" } },
  ],
};

let memoryOnly = false;
let state;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}
function uid(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 8)}${Date.now().toString(36).slice(-3)}`;
}
function todayISO() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function dayOffset(days) {
  const date = new Date();
  date.setHours(12, 0, 0, 0);
  date.setDate(date.getDate() + days);
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function stamp(days) {
  return `${dayOffset(days)}T16:00:00.000Z`;
}
function money(amount) {
  return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(Number(amount) || 0);
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [year, month, day] = String(iso).slice(0, 10).split("-").map(Number);
  if (!year || !month || !day) return "—";
  return new Date(year, month - 1, day).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function initials(name) {
  return String(name || "?").split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
}
function blob(parts) {
  return parts.filter(Boolean).join(" ").toLowerCase();
}
function withCurrent(list, current) {
  if (current && !list.includes(current)) return [current, ...list];
  return list;
}
function selectOptions(pairs, selected) {
  return pairs.map(([value, label]) => `<option value="${esc(value)}"${String(value) === String(selected ?? "") ? " selected" : ""}>${esc(label)}</option>`).join("");
}
function stageLabel(id) {
  return DEAL_STAGES.find((stage) => stage.id === id)?.label || id || "—";
}
function stageProb(id) {
  return DEAL_STAGES.find((stage) => stage.id === id)?.probability ?? 0;
}
function pill(value) {
  const key = String(value || "").toLowerCase().replace(/[^a-z]/g, "");
  return `<span class="pill pill-${key}">${esc(value || "—")}</span>`;
}
function typeLabel(type) {
  return { person: "Person", company: "Company", deal: "Deal", task: "Task" }[type] || "Record";
}
function viewType(view) {
  return { people: "person", companies: "company", deals: "deal", tasks: "task" }[view];
}
function isListView(view) {
  return ["people", "companies", "deals", "tasks"].includes(view);
}

function collection(type) {
  if (type === "person") return state.people;
  if (type === "company") return state.companies;
  if (type === "deal") return state.deals;
  if (type === "task") return state.tasks;
  return null;
}
function getRecord(type, id) {
  return (collection(type) || []).find((row) => row.id === id) || null;
}
function companyName(id) {
  return state.companies.find((company) => company.id === id)?.name || "";
}
function personName(id) {
  return state.people.find((person) => person.id === id)?.name || "";
}
function recordTitle(type, id) {
  const record = getRecord(type, id);
  return record?.name || record?.subject || "";
}
function openDeals(rows = state.deals) {
  return rows.filter((deal) => deal.stage !== "won" && deal.stage !== "lost");
}
function sumAmount(rows) {
  return rows.reduce((total, deal) => total + (Number(deal.amount) || 0), 0);
}
function weighted(rows) {
  return rows.reduce((total, deal) => total + (Number(deal.amount) || 0) * ((Number(deal.probability) || 0) / 100), 0);
}
function peopleAt(companyId) {
  return state.people.filter((person) => person.companyId === companyId);
}
function pipelineAt(companyId) {
  return openDeals(state.deals.filter((deal) => deal.companyId === companyId));
}
function lastTouch(type, id) {
  const record = getRecord(type, id);
  const times = [];
  if (record?.createdAt) times.push(record.createdAt);
  (record?.notes || []).forEach((note) => times.push(note.at));
  state.tasks.forEach((task) => {
    if (task.relatedType === type && task.relatedId === id && task.createdAt) times.push(task.createdAt);
  });
  times.sort();
  return times.at(-1) || "";
}
function defaultFilters(object) {
  if (object === "people") return { q: "", owner: "", stage: "", source: "", company: "", tag: "", viewId: "all" };
  if (object === "companies") return { q: "", owner: "", industry: "", tag: "", viewId: "all" };
  if (object === "deals") return { q: "", owner: "", stage: "", tag: "", status: "open", viewId: "open" };
  return { q: "", owner: "", type: "", status: "open", viewId: "open" };
}
function defaultUi() {
  return {
    view: "people",
    dealMode: "list",
    drawer: null,
    filters: {
      people: defaultFilters("people"),
      companies: defaultFilters("companies"),
      deals: defaultFilters("deals"),
      tasks: defaultFilters("tasks"),
    },
    sort: {
      people: { key: "name", dir: "asc" },
      companies: { key: "name", dir: "asc" },
      deals: { key: "amount", dir: "desc" },
      tasks: { key: "due", dir: "asc" },
    },
    columns: {
      people: DEFAULT_COLUMNS.people.slice(),
      companies: DEFAULT_COLUMNS.companies.slice(),
      deals: DEFAULT_COLUMNS.deals.slice(),
      tasks: DEFAULT_COLUMNS.tasks.slice(),
    },
  };
}
function cleanCols(object, keys) {
  const allowed = new Set(COLUMN_DEFS[object].map((column) => column.key));
  const locks = COLUMN_DEFS[object].filter((column) => column.lock).map((column) => column.key);
  const picked = Array.isArray(keys) ? keys.filter((key) => allowed.has(key)) : [];
  const base = picked.length ? picked : DEFAULT_COLUMNS[object];
  return Array.from(new Set([...locks, ...base]));
}
function freshUi(saved) {
  const base = defaultUi();
  return {
    view: isListView(saved?.view) || saved?.view === "overview" ? saved.view : base.view,
    dealMode: saved?.dealMode === "board" ? "board" : "list",
    drawer: saved?.drawer || null,
    filters: {
      people: { ...base.filters.people, ...(saved?.filters?.people || {}) },
      companies: { ...base.filters.companies, ...(saved?.filters?.companies || {}) },
      deals: { ...base.filters.deals, ...(saved?.filters?.deals || {}) },
      tasks: { ...base.filters.tasks, ...(saved?.filters?.tasks || {}) },
    },
    sort: {
      people: { ...base.sort.people, ...(saved?.sort?.people || {}) },
      companies: { ...base.sort.companies, ...(saved?.sort?.companies || {}) },
      deals: { ...base.sort.deals, ...(saved?.sort?.deals || {}) },
      tasks: { ...base.sort.tasks, ...(saved?.sort?.tasks || {}) },

    const saved = state.savedViews.find((view) => view.id === id && view.object === object);
    if (!saved) return;
    state.ui.filters[object] = { ...defaultFilters(object), ...saved.filters, viewId: id };
  }
  state.ui.selection = [];

}
function blank(type) {
  const owner = state.currentUser;
  if (type === "person") return { name: "", title: "", email: "", phone: "", companyId: "", owner, stage: "Lead", source: "Inbound", tags: [], notes: [] };
  if (type === "company") return { name: "", domain: "", industry: "Software", size: "1–10", city: "", owner, tags: [], notes: [] };
  if (type === "deal") return { name: "", companyId: "", contactId: "", amount: 0, stage: "new", probability: 10, close: dayOffset(30), owner, tags: [], notes: [] };
  return { subject: "", type: "Task", due: todayISO(), done: false, owner, relatedType: "person", relatedId: "", note: "", notes: [] };
}
function unlink(type, id) {
  if (type === "company") {
    state.people.forEach((person) => { if (person.companyId === id) person.companyId = ""; });
    state.deals.forEach((deal) => { if (deal.companyId === id) deal.companyId = ""; });
  }
  if (type === "person") state.deals.forEach((deal) => { if (deal.contactId === id) deal.contactId = ""; });
  state.tasks.forEach((task) => { if (task.relatedType === type && task.relatedId === id) task.relatedId = ""; });
}
function eachSelected(fn) {
  const type = viewType(state.ui.view);

function textField(prefix, key, label, value, type = "text", extra = "") {
  return `<label class="${extra}">${esc(label)}<input id="${prefix}-${key}" data-field="${key}" type="${type}" value="${esc(value ?? "")}" autocomplete="off"></label>`;
}
function areaField(prefix, key, label, value) {
  return `<label class="span-2">${esc(label)}<textarea id="${prefix}-${key}" data-field="${key}">${esc(value ?? "")}</textarea></label>`;
}
function selectField(prefix, key, label, pairs, value, extra = "") {
  return `<label class="${extra}">${esc(label)}<select id="${prefix}-${key}" data-field="${key}">${selectOptions(pairs, value)}</select></label>`;
}
function tagField(tags) {
  return `<div class="span-2"><span class="lbl">Tags</span><div class="tagset">${TAGS.map((tag) => `<button type="button" data-action="toggle-tag" data-tag="${esc(tag)}" aria-pressed="${(tags || []).includes(tag) ? "true" : "false"}">${esc(tag)}</button>`).join("")}</div></div>`;
}
function companyPairs(current) {
  const pairs = [["", "No company"], ...state.companies.map((company) => [company.id, company.name])];
  if (current && !state.companies.some((company) => company.id === current)) pairs.push([current, "Unknown company"]);
  return pairs;
}
function contactPairs(companyId, current) {
  let list = state.people.filter((person) => !companyId || person.companyId === companyId);
  if (current && !list.some((person) => person.id === current)) {
    const extra = state.people.find((person) => person.id === current);
    if (extra) list = [extra, ...list];
  }
  return [["", "No contact"], ...list.map((person) => [person.id, person.name])];
}
function relatedPairs(relatedType, current) {
  const list = collection(relatedType) || [];
  const pairs = [["", "None"], ...list.map((row) => [row.id, row.name || row.subject || "Record"])];
  if (current && !list.some((row) => row.id === current)) pairs.push([current, "Missing record"]);
  return pairs;
}
function fieldsFor(type, record, prefix) {

      tagField(record.tags),
    ].join("");
  }
  if (type === "company") {
    return [
      textField(prefix, "name", "Name", record.name, "text", "span-2"),

      textField(prefix, "city", "City", record.city),
      selectField(prefix, "industry", "Industry", withCurrent(INDUSTRIES, record.industry).map((item) => [item, item]), record.industry),
      selectField(prefix, "size", "Size", withCurrent(SIZES, record.size).map((item) => [item, item]), record.size),
      selectField(prefix, "owner", "Owner", OWNERS.map((owner) => [owner, owner]), record.owner, "span-2"),

    ].join("");
  }
  if (type === "deal") {

      textField(prefix, "amount", "Amount", record.amount, "number"),

      textField(prefix, "probability", "Probability", record.probability, "number"),

  return [

    selectField(prefix, "relatedType", "Related to", [["person", "Person"], ["company", "Company"], ["deal", "Deal"]], record.relatedType || "person"),
    selectField(prefix, "relatedId", "Record", relatedPairs(record.relatedType || "person", record.relatedId), record.relatedId || "", "span-2"),

function viewSelect(object) {

  const options = [
    current === "custom" ? `<option value="custom" selected>Custom</option>` : "",
    ...BUILTINS[object].map((view) => `<option value="${esc(view.id)}"${view.id === current ? " selected" : ""}>${esc(view.name)}</option>`),
    ...state.savedViews.filter((view) => view.object === object).map((view) => `<option value="${esc(view.id)}"${view.id === current ? " selected" : ""}>${esc(view.name)}</option>`),

function selectFilter(key, label, pairs, value) {

}
function columnMenu(object) {

  const checks = COLUMN_DEFS[object].map((column) => {

function saveMenu() {

function toolbar(object) {
  const filters = state.ui.filters[object];
  const parts = [viewSelect(object), `<input id="list-search" class="search" type="search" data-filter="q" placeholder="Search" value="${esc(filters.q)}" aria-label="Search" autocomplete="off">`];
  parts.push(selectFilter("owner", "Owner", [["", "All owners"], ...OWNERS.map((owner) => [owner, owner])], filters.owner));
  if (object === "people") {
    parts.push(selectFilter("stage", "Stage", [["", "All stages"], ...CONTACT_STAGES.map((stage) => [stage, stage])], filters.stage));
    parts.push(selectFilter("source", "Source", [["", "All sources"], ...SOURCES.map((source) => [source, source])], filters.source));
    parts.push(selectFilter("company", "Company", [["", "All companies"], ...state.companies.map((company) => [company.id, company.name])], filters.company));
  }
  if (object === "companies") parts.push(selectFilter("industry", "Industry", [["", "All industries"], ...INDUSTRIES.map((item) => [item, item])], filters.industry));
  if (object === "deals") {
    parts.push(selectFilter("status", "Status", [["open", "Open"], ["won", "Won"], ["lost", "Lost"], ["all", "All"]], filters.status));
    parts.push(selectFilter("stage", "Stage", [["", "All stages"], ...DEAL_STAGES.map((stage) => [stage.id, stage.label])], filters.stage));

  if (object === "tasks") {

  return `<div class="toolbar">${parts.join("")}</div>`;

function bulkBar(object) {

  const stage = object === "people"
    ? `<select id="bulk-stage" aria-label="Stage">${selectOptions([["", "Stage"], ...CONTACT_STAGES.map((item) => [item, item])], "")}</select><button type="button" class="btn" data-action="bulk-stage">Set stage</button>`
    : object === "deals"
      ? `<select id="bulk-stage" aria-label="Stage">${selectOptions([["", "Stage"], ...DEAL_STAGES.map((item) => [item.id, item.label])], "")}</select><button type="button" class="btn" data-action="bulk-stage">Set stage</button>`

  return `<div class="bulkbar"><strong>${count} selected</strong><select id="bulk-owner" aria-label="Owner">${selectOptions([["", "Owner"], ...OWNERS.map((owner) => [owner, owner])], "")}</select><button type="button" class="btn" data-action="bulk-owner">Assign</button>${stage}${tag}<button type="button" class="btn" data-action="bulk-delete">Delete</button><button type="button" class="btn" data-action="clear-selection">Clear</button></div>`;

function table(object, rows) {
  const columns = activeColumns(object);
  const ids = rows.map((row) => row.id);
  const allOn = ids.length > 0 && ids.every((id) => state.ui.selection.includes(id));
  const type = viewType(object);
  const head = `<th class="check"><input type="checkbox" data-action="toggle-select-all" aria-label="Select all"${allOn ? " checked" : ""}></th>${columns.map((column) => {
    const arrow = state.ui.sort[object].key === column.key ? (state.ui.sort[object].dir === "asc" ? " ↑" : " ↓") : "";
    return `<th class="${column.num ? "num" : ""}"><button type="button" data-action="sort" data-key="${column.key}">${esc(column.label)}${arrow}</button></th>`;
  }).join("")}`;
  const body = rows.map((row) => {
    const classes = [
      state.ui.selection.includes(row.id) ? "is-selected" : "",
      row.done ? "is-done" : "",
      object === "tasks" && !row.done && row.due && row.due < todayISO() ? "is-overdue" : "",
    ].filter(Boolean).join(" ");
    const cells = columns.map((column) => `<td class="${column.num ? "num" : ""} ${column.key === "due" ? "due-cell" : ""}">${column.render(row)}</td>`).join("");
    return `<tr class="${classes}" data-action="open-record" data-type="${type}" data-id="${esc(row.id)}"><td class="check"><input type="checkbox" data-action="toggle-select" data-id="${esc(row.id)}" aria-label="Select ${esc(row.name || row.subject || "row")}"${state.ui.selection.includes(row.id) ? " checked" : ""}></td>${cells}</tr>`;
  }).join("");
  const empty = rows.length ? "" : `<tr><td class="empty" colspan="${columns.length + 1}">${state[object].length ? "Nothing matches this view." : `No ${object} yet.`} ${state[object].length ? `<button type="button" class="btn" data-action="clear-filters">Clear filters</button>` : ""}</td></tr>`;
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}${empty}</tbody></table></div>`;
}
function board(rows) {

    return `<section class="column" data-drop-stage="${stage.id}"><header><strong>${esc(stage.label)}</strong><span>${cards.length} · ${money(sumAmount(cards))}</span></header>${cards.map((deal) => `<article class="deal-card" draggable="true" data-drag-id="${esc(deal.id)}" data-action="open-record" data-type="deal" data-id="${esc(deal.id)}"><strong>${esc(deal.name)}</strong><span>${esc(companyName(deal.companyId) || "No company")}</span><span class="money">${money(deal.amount)}</span><span class="meta">${esc(fmtDate(deal.close))} · ${esc(deal.owner)}</span></article>`).join("")}${cards.length ? "" : `<p class="meta">Drop a deal here</p>`}</section>`;

function pageHead(title, lede, action) {
  return `<div class="page-head"><div><h1>${title}</h1><p class="lede">${lede}</p></div>${action || ""}</div>`;
}
function newButton(type, label) {
  return `<button type="button" class="btn primary" data-action="new-record" data-type="${type}">${label}</button>`;
}
function overview() {
  const open = openDeals();
  const won = state.deals.filter((deal) => deal.stage === "won");
  const lost = state.deals.filter((deal) => deal.stage === "lost");
  const openTasks = state.tasks.filter((task) => !task.done).slice().sort((a, b) => String(a.due).localeCompare(String(b.due)));
  const overdue = openTasks.filter((task) => task.due && task.due < todayISO()).length;
  const max = Math.max(...DEAL_STAGES.filter((stage) => stage.id !== "lost").map((stage) => sumAmount(state.deals.filter((deal) => deal.stage === stage.id))), 1);
  const bars = DEAL_STAGES.filter((stage) => stage.id !== "lost").map((stage) => {
    const rows = state.deals.filter((deal) => deal.stage === stage.id);
    const width = Math.round((sumAmount(rows) / max) * 100);
    return `<div class="bar-row"><button type="button" data-action="jump-stage" data-stage="${stage.id}">${esc(stage.label)}</button><div class="track ${stage.id === "won" ? "won" : ""}"><span style="width:${width}%"></span></div><span>${money(sumAmount(rows))}</span></div>`;
  }).join("");
  const taskList = openTasks.slice(0, 6).map((task) => `<div class="task-line"><button type="button" class="subject" data-action="open-record" data-type="task" data-id="${esc(task.id)}">${esc(task.subject)}</button><span class="${task.due < todayISO() ? "overdue" : "meta"}">${esc(fmtDate(task.due))}</span></div>`).join("") || `<p class="meta">No open tasks.</p>`;
  const feed = activityFeed().map((item) => `<div class="feed-item"><div><strong>${esc(item.label)}</strong><p class="meta">${esc(item.detail)}</p></div><span class="meta">${esc(fmtDate(item.at))}</span></div>`).join("");
  return `${pageHead("Overview", "Pipeline, open tasks, and the latest notes in this book.")}
    <section class="stats">
      <article><p class="kicker">Open pipeline</p><p class="stat">${money(sumAmount(open))}</p><p class="sub">${open.length} deals</p></article>
      <article><p class="kicker">Weighted</p><p class="stat">${money(weighted(open))}</p><p class="sub">Amount × probability</p></article>
      <article><p class="kicker">Won</p><p class="stat">${money(sumAmount(won))}</p><p class="sub">${won.length} closed · ${money(sumAmount(lost))} lost</p></article>
      <article><p class="kicker">Open tasks</p><p class="stat">${openTasks.length}</p><p class="sub">${overdue} overdue</p></article>
    </section>
    <div class="split">
      <section class="panel"><h2>Pipeline by stage</h2><div class="bars">${bars}</div></section>
      <section class="panel"><h2>Tasks due</h2>${taskList}</section>
    </div>
    <section class="panel feed"><h2>Recent activity</h2>${feed}</section>`;
}
function activityFeed() {
  const items = [];
  [["person", state.people], ["company", state.companies], ["deal", state.deals]].forEach(([type, rows]) => {
    rows.forEach((row) => {
      (row.notes || []).forEach((entry) => items.push({ at: entry.at, label: `${entry.author} on ${row.name}`, detail: entry.body }));
    });
  });
  state.tasks.forEach((task) => items.push({ at: task.createdAt, label: `${task.type}: ${task.subject}`, detail: recordTitle(task.relatedType, task.relatedId) || task.owner }));
  return items.sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 8);
}
function listPage(object, title, lede, type, button) {
  const rows = query(object);
  const shown = rows.length === state[object].length ? String(rows.length) : `${rows.length} of ${state[object].length}`;
  const body = object === "deals" && state.ui.dealMode === "board" ? board(rows) : `${bulkBar(object)}${table(object, rows)}`;
  return `${pageHead(`${title} <span class="count">${shown}</span>`, lede, newButton(type, button))}${toolbar(object)}${body}`;
}
function main() {
  const view = state.ui.view;

  if (view === "companies") return `<main>${listPage("companies", "Companies", "Accounts, owners, and the open pipeline on each.", "company", "New company")}</main>`;
  if (view === "deals") return `<main>${listPage("deals", "Deals", "Switch between the list and the stage board.", "deal", "New deal")}</main>`;

function relatedBlock(type, record) {

function activityBlock(type, id) {

  const tasks = state.tasks.filter((task) => task.relatedType === type && task.relatedId === id);
  const list = tasks.map((task) => `<div class="task-line"><button type="button" class="subject" data-action="open-record" data-type="task" data-id="${esc(task.id)}">${esc(task.type)}: ${esc(task.subject)}</button><span class="meta">${task.done ? "Done" : esc(fmtDate(task.due))}</span></div>`).join("");
  return `<section><h3>Activity</h3><div class="activity-row"><select id="act-type" data-activity-field="type" aria-label="Activity type">${selectOptions(TASK_TYPES.map((item) => [item, item]), draft.type)}</select><input id="act-subject" data-activity-field="subject" placeholder="Subject" value="${esc(draft.subject)}" autocomplete="off"><input id="act-due" data-activity-field="due" type="date" value="${esc(draft.due)}" aria-label="Due"><button type="button" class="btn" data-action="add-activity">Add</button></div>${state.ui.activityError ? `<p class="form-error">${esc(state.ui.activityError)}</p>` : ""}${list}</section>`;
}
function drawer() {
  const current = state.ui.drawer;
  if (!current) return "";
  const record = getRecord(current.type, current.id);
  if (!record) return "";
  return `<button type="button" class="scrim" data-action="close-drawer" aria-label="Close details"></button><aside class="drawer" role="dialog" aria-label="${esc(typeLabel(current.type))}"><div class="drawer-top"><p class="kicker">${esc(typeLabel(current.type))}</p><button type="button" class="btn" data-action="close-drawer">Close</button></div><div data-editor="record"><div class="fields">${fieldsFor(current.type, record, "d")}</div>${relatedBlock(current.type, record)}${current.type === "task" ? "" : activityBlock(current.type, current.id)}${notesBlock(record)}</div><button type="button" class="btn danger" data-action="delete-record">Delete</button></aside>`;
}
function modal() {
  if (!state.ui.modal || !state.ui.draft) return "";
  return `<button type="button" class="scrim modal-scrim" data-action="close-modal" aria-label="Close"></button><form class="modal" role="dialog" aria-label="New record" data-form="create" data-editor="draft"><h2>New ${esc(typeLabel(state.ui.modal).toLowerCase())}</h2>${state.ui.formError ? `<p class="form-error">${esc(state.ui.formError)}</p>` : ""}<div class="fields">${fieldsFor(state.ui.modal, state.ui.draft, "m")}</div><div class="modal-actions"><button type="submit" class="btn primary">Create</button><button type="button" class="btn" data-action="close-modal">Cancel</button></div></form>`;
}
function render() {
  if (state.ui.drawer && !getRecord(state.ui.drawer.type, state.ui.drawer.id)) state.ui.drawer = null;
  const focus = document.activeElement;
  const focusId = focus && focus.id;
  const start = focus && typeof focus.selectionStart === "number" ? focus.selectionStart : null;
  const end = focus && typeof focus.selectionEnd === "number" ? focus.selectionEnd : null;
  document.getElementById("app").innerHTML = `<div class="shell">${sidebar()}${main()}</div>${drawer()}${modal()}`;
  const titles = { overview: "Overview", people: "People", companies: "Companies", deals: "Deals", tasks: "Tasks" };
  document.title = `Fieldbook · ${titles[state.ui.view] || "Fieldbook"}`;
  if (!focusId) return;
  const next = document.getElementById(focusId);
  if (!next) return;
  next.focus();
  if (start != null && next.setSelectionRange) {
    try { next.setSelectionRange(start, end); } catch { /* date and select inputs */ }
  }
}

function download(filename, text, type) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], { type }));
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
}
function exportCsv() {
  const object = state.ui.view;
  if (!isListView(object)) return;
  const columns = activeColumns(object);
  const lines = [columns.map((column) => column.label), ...query(object).map((row) => columns.map((column) => column.text(row)))];
  const csv = lines.map((line) => line.map((cell) => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  download(`${object}.csv`, csv, "text/csv");
}
function createRecord() {
  const type = state.ui.modal;
  const draft = state.ui.draft;
  const label = String(draft?.name || draft?.subject || "").trim();
  if (!label) {
    state.ui.formError = type === "task" ? "Add a subject first." : "Add a name first.";
    render();
    return;
  }
  const record = { ...draft, tags: [...(draft.tags || [])], notes: [], id: uid(type.slice(0, 1)), createdAt: new Date().toISOString() };
  if (type === "person" || type === "company" || type === "deal") record.name = label;
  if (type === "task") record.subject = label;
  if (type === "deal") {
    record.amount = Math.max(0, Number(record.amount) || 0);
    record.probability = record.stage === "won" ? 100 : record.stage === "lost" ? 0 : Math.max(0, Math.min(100, Number(record.probability) || stageProb(record.stage)));
  }
  collection(type).unshift(record);
  state.ui.modal = null;
  state.ui.draft = null;
  state.ui.formError = "";
  state.ui.view = { person: "people", company: "companies", deal: "deals", task: "tasks" }[type];
  state.ui.drawer = { type, id: record.id };
  persist();
  render();
}
function saveCurrentView() {
  const object = state.ui.view;
  const name = document.getElementById("new-view-name")?.value.trim();
  if (!name || !isListView(object)) return;
  const { viewId, ...filters } = state.ui.filters[object];
  const view = { id: uid("v"), object, name, filters };
  state.savedViews.push(view);
  state.ui.filters[object].viewId = view.id;
  state.ui.saveOpen = false;
  persist();
  render();
}
function addNote() {
  const text = state.ui.noteDraft.trim();
  const current = state.ui.drawer;
  if (!text || !current) return;
  const record = getRecord(current.type, current.id);
  if (!record) return;
  record.notes = record.notes || [];
  record.notes.unshift({ id: uid("n"), body: text, author: state.currentUser, at: new Date().toISOString() });
  state.ui.noteDraft = "";
  persist();
  render();
}
function addActivity() {
  const current = state.ui.drawer;
  const draft = state.ui.activityDraft;
  if (!current) return;
  if (!String(draft.subject || "").trim()) {
    state.ui.activityError = "Add a subject first.";
    render();
    return;
  }
  state.tasks.unshift({
    id: uid("t"),
    type: draft.type || "Task",
    subject: draft.subject.trim(),
    due: draft.due || todayISO(),
    done: false,
    owner: state.currentUser,
    relatedType: current.type,
    relatedId: current.id,
    note: "",
    notes: [],
    createdAt: new Date().toISOString(),
  });
  state.ui.activityDraft = { type: "Call", subject: "", due: todayISO() };
  state.ui.activityError = "";
  persist();
  render();
}
function updateField(editor, element, restoreIfBlank) {
  const record = editor.dataset.editor === "draft" ? state.ui.draft : getRecord(state.ui.drawer?.type, state.ui.drawer?.id);
  if (!record) return;
  const key = element.dataset.field;
  if ((key === "name" || key === "subject") && !String(element.value).trim()) {
    if (restoreIfBlank) render();
    return;
  }
  if (key === "amount") record.amount = Math.max(0, Number(element.value) || 0);
  else if (key === "probability") record.probability = Math.max(0, Math.min(100, Number(element.value) || 0));
  else if (element.type === "checkbox") record[key] = element.checked;
  else record[key] = element.value;
  const isDeal = (editor.dataset.editor === "draft" && state.ui.modal === "deal") || (editor.dataset.editor === "record" && state.ui.drawer?.type === "deal");
  if (isDeal && key === "stage") {
    if (record.stage === "won") record.probability = 100;
    if (record.stage === "lost") record.probability = 0;
  }
  if (isDeal && key === "companyId") {
    const contact = state.people.find((person) => person.id === record.contactId);
    if (contact && record.companyId && contact.companyId !== record.companyId) record.contactId = "";
  }
  if (editor.dataset.editor === "record") persist();
  render();
}
function importBook(data) {
  if (!validRows(data?.people) || !validRows(data?.companies) || !validRows(data?.deals) || !validRows(data?.tasks)) {
    window.alert("That file is not a Fieldbook book.");
    return;
  }
  if (!window.confirm("Replace the current book with this file?")) return;
  state = bookFrom(data);
  persist();
  render();
}

let suppressClick = false;

function elementFrom(target) {
  return target instanceof Element ? target : target?.parentElement || null;
}
function onClick(event) {
  if (suppressClick) return;
  const eventTarget = elementFrom(event.target);
  if (!eventTarget || eventTarget.closest("a[href]")) return;
  const element = eventTarget.closest("[data-action]");
  if (!element) return;
  const action = element.dataset.action;
  if (action === "nav") {
    state.ui.view = element.dataset.view;
    state.ui.drawer = null;
    state.ui.selection = [];
    state.ui.columnsOpen = false;
    state.ui.saveOpen = false;
    persist();
    render();
  } else if (action === "open-record") {
    openRecord(element.dataset.type, element.dataset.id);
  } else if (action === "close-drawer") {
    state.ui.drawer = null;
    persist();
    render();
  } else if (action === "close-modal") {
    state.ui.modal = null;
    state.ui.draft = null;
    state.ui.formError = "";
    render();
  } else if (action === "new-record") {
    state.ui.modal = element.dataset.type;
    state.ui.draft = blank(element.dataset.type);
    state.ui.formError = "";
    render();
  } else if (action === "delete-record") {
    const current = state.ui.drawer;
    const record = current && getRecord(current.type, current.id);
    if (!record || !window.confirm(`Delete ${record.name || record.subject}?`)) return;
    const list = collection(current.type);
    const index = list.findIndex((row) => row.id === current.id);
    if (index >= 0) list.splice(index, 1);
    unlink(current.type, current.id);
    state.ui.drawer = null;
    persist();
    render();
  } else if (action === "toggle-select") {
    const id = element.dataset.id;
    state.ui.selection = state.ui.selection.includes(id) ? state.ui.selection.filter((item) => item !== id) : [...state.ui.selection, id];
    render();
  } else if (action === "toggle-select-all") {
    const rows = query(state.ui.view).map((row) => row.id);
    const allOn = rows.every((id) => state.ui.selection.includes(id));
    state.ui.selection = allOn ? state.ui.selection.filter((id) => !rows.includes(id)) : Array.from(new Set([...state.ui.selection, ...rows]));
    render();
  } else if (action === "clear-selection") {
    state.ui.selection = [];
    render();
  } else if (action === "sort") {
    const object = state.ui.view;
    const key = element.dataset.key;
    const sort = state.ui.sort[object];
    state.ui.sort[object] = sort.key === key ? { key, dir: sort.dir === "asc" ? "desc" : "asc" } : { key, dir: ["amount", "pipeline", "probability", "people"].includes(key) ? "desc" : "asc" };
    persist();
    render();
  } else if (action === "toggle-columns") {
    event.stopPropagation();
    state.ui.columnsOpen = !state.ui.columnsOpen;
    state.ui.saveOpen = false;
    render();
  } else if (action === "toggle-save") {
    event.stopPropagation();
    state.ui.saveOpen = !state.ui.saveOpen;
    state.ui.columnsOpen = false;
    render();
  } else if (action === "delete-view") {
    const object = state.ui.view;
    state.savedViews = state.savedViews.filter((view) => view.id !== state.ui.filters[object].viewId);
    applyView(object, object === "deals" || object === "tasks" ? "all" : "all");
  } else if (action === "clear-filters") {
    applyView(state.ui.view, "all");
  } else if (action === "export") {
    exportCsv();
  } else if (action === "export-book") {
    download("fieldbook.json", JSON.stringify(payload(), null, 2), "application/json");
  } else if (action === "import-book") {
    document.getElementById("import-file")?.click();
  } else if (action === "reset-book") {
    if (!window.confirm("Replace the book on this computer with the sample records?")) return;
    state = seed();
    persist();
    render();
  } else if (action === "deal-mode") {
    state.ui.dealMode = element.dataset.mode === "board" ? "board" : "list";
    persist();
    render();
  } else if (action === "jump-stage") {
    state.ui.view = "deals";
    state.ui.drawer = null;
    state.ui.dealMode = "list";
    state.ui.filters.deals = { ...defaultFilters("deals"), stage: element.dataset.stage, status: "all", viewId: "custom" };
    persist();
    render();
  } else if (action === "toggle-task") {
    const task = getRecord("task", element.dataset.id);
    if (!task) return;
    task.done = !task.done;
    persist();
    render();
  } else if (action === "toggle-tag") {
    const editor = element.closest("[data-editor]");
    const record = editor?.dataset.editor === "draft" ? state.ui.draft : getRecord(state.ui.drawer?.type, state.ui.drawer?.id);
    if (!record) return;
    const tags = new Set(record.tags || []);
    if (tags.has(element.dataset.tag)) tags.delete(element.dataset.tag);
    else tags.add(element.dataset.tag);
    record.tags = [...tags];
    if (editor?.dataset.editor === "record") persist();
    render();
  } else if (action === "add-activity") {
    addActivity();
  } else if (action === "bulk-owner") {
    const owner = document.getElementById("bulk-owner")?.value;
    if (owner) eachSelected((record) => { record.owner = owner; });
  } else if (action === "bulk-stage") {
    const stage = document.getElementById("bulk-stage")?.value;
    if (!stage) return;
    eachSelected((record) => {
      record.stage = stage;
      if (state.ui.view === "deals" && stage === "won") record.probability = 100;
      if (state.ui.view === "deals" && stage === "lost") record.probability = 0;
    });
  } else if (action === "bulk-tag") {
    const tag = document.getElementById("bulk-tag")?.value;
    if (!tag) return;
    eachSelected((record) => { record.tags = Array.from(new Set([...(record.tags || []), tag])); });
  } else if (action === "bulk-done") {
    eachSelected((record) => { record.done = true; });
  } else if (action === "bulk-delete") {
    const type = viewType(state.ui.view);
    if (!state.ui.selection.length || !window.confirm(`Delete ${state.ui.selection.length} selected?`)) return;
    const list = collection(type);
    state.ui.selection.forEach((id) => {
      const index = list.findIndex((row) => row.id === id);
      if (index >= 0) list.splice(index, 1);
      unlink(type, id);
    });
    state.ui.selection = [];
    state.ui.drawer = null;
    persist();
    render();
  }
}
function openRecord(type, id) {
  if (!getRecord(type, id)) return;
  state.ui.drawer = { type, id };
  state.ui.noteDraft = "";
  state.ui.activityError = "";
  state.ui.activityDraft = { type: "Call", subject: "", due: todayISO() };
  persist();
  render();
}
function onFieldEvent(event) {
  const element = elementFrom(event.target);
  if (!element) return;
  if (element.id === "note-draft") {
    state.ui.noteDraft = element.value;
    return;
  }
  if (element.dataset.activityField) {
    state.ui.activityDraft[element.dataset.activityField] = element.value;
    return;
  }
  if (element.dataset.filter) {
    const object = state.ui.view;
    const key = element.dataset.filter;
    if (key === "q" && event.type !== "input") return;
    if (key !== "q" && event.type !== "change") return;
    if (key === "viewPick") {
      applyView(object, element.value);
      return;
    }
    state.ui.filters[object][key] = element.value;
    syncViewId(object);
    state.ui.selection = [];
    persist();
    render();
    return;
  }
  if (element.dataset.column && event.type === "change") {
    const object = state.ui.view;
    const column = COLUMN_DEFS[object].find((item) => item.key === element.dataset.column);
    if (!column || column.lock) return;
    const columns = state.ui.columns[object];
    state.ui.columns[object] = columns.includes(column.key) ? columns.filter((key) => key !== column.key) : [...columns, column.key];
    persist();
    render();
    return;
  }
  if (element.matches("[data-user-switch]") && event.type === "change") {
    state.currentUser = element.value;
    ["people", "companies", "deals", "tasks"].forEach((object) => {
      if (state.ui.filters[object].viewId === "mine") state.ui.filters[object].owner = state.currentUser;
    });
    persist();
    render();
    return;
  }
  if (!element.dataset.field) return;
  const typing = ["text", "search", "email", "tel", "number", "date", ""].includes(element.type) || element.tagName === "TEXTAREA";
  if (element.tagName === "SELECT" && event.type !== "change") return;
  if (element.type === "checkbox" && event.type !== "change") return;
  if (typing && element.tagName !== "SELECT" && event.type !== "input" && event.type !== "change") return;
  const editor = element.closest("[data-editor]");
  if (!editor) return;
  updateField(editor, element, event.type === "change");
}
function onSubmit(event) {
  const form = event.target.closest("form");
  if (!form) return;
  event.preventDefault();
  if (form.dataset.form === "create") createRecord();
  if (form.dataset.form === "note") addNote();
  if (form.dataset.form === "save-view") saveCurrentView();
}

function bind() {
  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("input", onFieldEvent);
  app.addEventListener("change", onFieldEvent);
  app.addEventListener("submit", onSubmit);
  app.addEventListener("search", (event) => {
    if (event.target.dataset?.filter === "q") onFieldEvent({ type: "input", target: event.target });
  });
  app.addEventListener("dragend", () => {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 100);
  });
  app.addEventListener("dragstart", (event) => {
    const card = event.target.closest("[data-drag-id]");
    if (!card) return;
    event.dataTransfer.setData("text/plain", card.dataset.dragId);
    event.dataTransfer.effectAllowed = "move";
  });
  app.addEventListener("dragover", (event) => {
    const column = event.target.closest("[data-drop-stage]");
    if (!column) return;
    event.preventDefault();
    document.querySelectorAll("[data-drop-stage]").forEach((item) => item.classList.toggle("drop-target", item === column));
  });
  app.addEventListener("drop", (event) => {
    const column = event.target.closest("[data-drop-stage]");
    if (!column) return;
    event.preventDefault();
    const deal = getRecord("deal", event.dataTransfer.getData("text/plain"));
    if (!deal) return;
    deal.stage = column.dataset.dropStage;
    if (deal.stage === "won") deal.probability = 100;
    if (deal.stage === "lost") deal.probability = 0;
    persist();
    render();
  });
  document.addEventListener("keydown", (event) => {
    const typing = event.target.matches("input, textarea, select");
    if (event.key === "/" && !typing) {
      event.preventDefault();
      document.getElementById("list-search")?.focus();
    }
    if (event.key !== "Escape") return;
    if (state.ui.modal) {
      state.ui.modal = null;
      state.ui.draft = null;
      render();
    } else if (state.ui.columnsOpen || state.ui.saveOpen) {
      state.ui.columnsOpen = false;
      state.ui.saveOpen = false;
      render();
    } else if (state.ui.drawer) {
      state.ui.drawer = null;
      persist();
      render();
    }
  });
  document.addEventListener("click", (event) => {
    if (!state.ui.columnsOpen && !state.ui.saveOpen) return;
    if (event.target.closest("[data-popover-root]")) return;
    state.ui.columnsOpen = false;
    state.ui.saveOpen = false;
    render();
  });
  document.getElementById("app").addEventListener("change", (event) => {
    if (event.target.id !== "import-file" || !event.target.files?.[0]) return;
    const file = event.target.files[0];
    event.target.value = "";
    const reader = new FileReader();
    reader.onload = () => {
      try { importBook(JSON.parse(String(reader.result))); }
      catch { window.alert("Could not read that file."); }
    };
    reader.readAsText(file);
  });
}

state = load();
bind();
persist();
render();

  </script>
